name: Daily Broadsheet E-Paper Agent (24/7 Autonomous)

on:
  workflow_dispatch:
    inputs:
      skip_llm:
        description: 'Bypass LLM APIs and use fast extractive summarization'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Run pipeline without distribution or committing ledger'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish_daily_epaper:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for Broadsheet Typography & PDF
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libffi-dev \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-indic \
            fonts-noto-core \
            chromium-browser || true

      - name: Install Python Dependencies (Fast CPU-Optimized)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Execute Autonomous E-Paper News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.skip_llm }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --skip-llm"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
          fi
          python src/main.py $EXTRA_FLAGS

      - name: Upload PDF & Edition Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-epaper-editions
          path: |
            editions/**/*.pdf
            editions/**/*.md
            editions/**/*.html
          retention-days: 90

      - name: Commit and Push Deduplication Memory Ledger
        if: ${{ inputs.dry_run != true }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_urls.json
          git commit -m "chore(ledger): update seen URLs deduplication memory [skip ci]" || echo "No new seen URLs to commit"
          git push origin HEAD || echo "No changes pushed"
